<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lore - Home{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f7f7f4; font-size: 0.875rem; }
        .sidebar { width: 240px; min-height: 100vh; background-color: #fff; border-right: 1px solid #e5e5e5; }
        @media (max-width: 767.98px) {
            .sidebar.offcanvas-md { min-height: 100%; }
        }
        .sidebar .h4 { font-size: 1.25rem; }
        .sidebar .nav-link { color: #333; background-color: #eae9e9; border-radius: .5rem; padding: .5rem .85rem; font-weight: 600; font-size: 0.85rem;}
        .sidebar .nav-link:hover { background-color: #cbcbc8; }
        .sidebar .nav-pills .nav-link.active { background-color: #5e0c98; color: #ffffff; font-weight: 600; }
        .topbar { background-color: #fff; border-bottom: 1px solid #e5e5e5; }
        .main-body { background-color: #f7f7f4; }
    </style>
</head>
<body>
    <div class="d-flex">
        <aside class="sidebar offcanvas-md offcanvas-start d-flex flex-column p-3" tabindex="-1" id="sidebarMenu" aria-label="Sidebar">
            <div class="d-flex align-items-start justify-content-between">
                <a href="/" class="h4 text-decoration-none text-dark mb-4 fw-bold"><i class="bi bi-building-fill me-2" style="color: #5e0c98;"></i>LORE</a>
                <button type="button" class="btn-close d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
            </div>
            <ul class="nav nav-pills flex-column gap-2 mt-2">
                <li class="nav-item"><a href="#" class="nav-link active"><i class="bi bi-house me-2"></i>Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-book me-2"></i>Courses</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-bookmark me-2"></i>Bookmarks</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-people me-2"></i>Community</a></li>
            </ul>
            <ul class="nav nav-pills flex-column gap-2 mt-auto">
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-person me-2"></i>My Account</a></li>
                <li class="nav-item"><a href="#" class="nav-link"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                <li class="nav-item text-muted small text-center mt-2">© 2026 Lore. All rights reserved.</li>

            </ul>
        </aside>

        <div class="flex-grow-1 d-flex flex-column min-vh-100">

            <header class="topbar d-flex align-items-center justify-content-between px-2 py-2 border rounded-3 m-2 mb-0">
                <button class="btn btn-outline-secondary d-md-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <form class="d-flex flex-grow-1 me-3" role="search" style="max-width: 300px;">
                    <input class="form-control w-100" type="search" placeholder="Search">
                </form>
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-4"></i>
                    <div class="lh-sm">
                        <div class="fw-semibold">{{ user.first_name }} {{ user.last_name }}</div>
                        <small class="text-muted">{{ user.role }}</small>
                    </div>
                </div>
            </header>

            <main class="main-body flex-grow-1 d-flex flex-column">
                <div class="bg-white border rounded-3 m-2 p-3 flex-grow-1">
                    {% block content %}

                    {% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
